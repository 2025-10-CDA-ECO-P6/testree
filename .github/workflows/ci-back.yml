# CI du back : chaque PR vers master qui touche back/ doit compiler et passer ses tests.
name: CI back

on:
  pull_request:
    branches: [master]
    paths: ['back/**', '.github/workflows/ci-back.yml']
  push:
    branches: [master]
    paths: ['back/**', '.github/workflows/ci-back.yml']

permissions:
  contents: read

jobs:
  back:
    name: back (compilation, tests, jar)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: back/pom.xml

      # verify = compilation + tests JUnit + jar. -B : mode non interactif (pas de questions, pas de couleurs).
      - name: Build et tests
        run: ./mvnw -B --no-transfer-progress verify
